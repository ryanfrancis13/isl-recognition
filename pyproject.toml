[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isl"
version = "0.1.0"
description = "Real-time Indian Sign Language recognition using MediaPipe Holistic and temporal neural networks."
requires-python = ">=3.10,<3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

